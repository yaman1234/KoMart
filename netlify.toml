[build]
  base    = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* to the backend (handles production, UAT, and deploy previews)
[[redirects]]
  from   = "/api/*"
  to     = "https://ko-mart.vercel.app/api/:splat"
  status = 200
  force  = true

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  VITE_APP_ENV = "production"
  # Set in Netlify UI (required): VITE_API_BASE_URL = https://ko-mart.vercel.app/api/v1
  # Optional: enable Netlify /api proxy instead of baking the URL into the build (see redirects above).
